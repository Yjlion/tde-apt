name: Publish apt repository

on:
  workflow_dispatch:
  # Optional: app repos can trigger this after attaching a .deb to a release:
  #   gh api repos/Yjlion/tde-apt/dispatches -f event_type=new-deb
  repository_dispatch:
    types: [new-deb]
  # Fallback so new releases get picked up without any cross-repo token.
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths: [conf/**, site/**, .github/workflows/publish.yml]

# Only one publish at a time; never cancel a deploy half way.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Repos whose latest GitHub release carries the .deb files.
  SOURCE_REPOS: "Yjlion/tde-systemd Yjlion/tde-flatpak Yjlion/tde-packagekit Yjlion/tde-firewalld Yjlion/tde-refresh Yjlion/tde-youtube Yjlion/tde-ai-client Yjlion/tde-mixer Yjlion/tde-nmctl Yjlion/tde-tmatrix"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro gnupg

      - name: Import signing key
        env:
          APT_GPG_KEY: ${{ secrets.APT_GPG_KEY }}
        run: |
          test -n "$APT_GPG_KEY" || { echo "::error::Secret APT_GPG_KEY is not set"; exit 1; }
          printf '%s\n' "$APT_GPG_KEY" | gpg --batch --import
          # The key must have no passphrase (see README); reprepro signs non-interactively.
          gpg --list-secret-keys --keyid-format long

      - name: Download .debs from the latest release of each repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p debs
          for repo in $SOURCE_REPOS; do
            echo "== $repo"
            gh release download --repo "$repo" --pattern '*.deb' --dir debs --clobber \
              || echo "::warning::No release with .deb assets in $repo (skipped)"
          done
          # Debug-symbol packages (*-dbgsym_*.deb) are not published.
          rm -f debs/*-dbgsym_*.deb
          # Sort the files by Debian release. A build for bookworm is marked in its
          # file name (version "~bookworm" or suffix "_bookworm.deb"); every other
          # file, marked "trixie" or not marked at all, is a trixie build.
          mkdir -p debs/trixie debs/bookworm
          for f in debs/*.deb; do
            [ -e "$f" ] || continue
            case "$(basename "$f")" in
              *bookworm*) mv "$f" debs/bookworm/ ;;
              *)          mv "$f" debs/trixie/ ;;
            esac
          done
          ls -lR debs
          compgen -G 'debs/trixie/*.deb' > /dev/null || { echo "::error::No .deb files found for trixie"; exit 1; }
          compgen -G 'debs/bookworm/*.deb' > /dev/null || echo "::warning::No .deb files found for bookworm"

      - name: Build and sign the repository
        run: |
          # Each suite gets its own reprepro database and pool: a source repo may
          # attach builds for trixie and bookworm with the same version but
          # different contents, which cannot share one pool. trixie stays at the
          # site root (as before); bookworm is published under /bookworm.
          for dist in trixie bookworm; do
            if [ "$dist" = trixie ]; then out=public; else out="public/$dist"; fi
            mkdir -p "$out"
            rr=(reprepro -b . --dbdir "$PWD/db/$dist" --outdir "$PWD/$out")
            if compgen -G "debs/$dist/*.deb" > /dev/null; then
              "${rr[@]}" includedeb "$dist" debs/"$dist"/*.deb
            fi
            # Export even when empty, so apt update works for every suite.
            "${rr[@]}" export "$dist"
          done
          gpg --armor --export > public/tde-apt.asc
          cp site/index.html public/index.html
          touch public/.nojekyll
          # Do not publish reprepro's own bookkeeping.
          rm -rf public/db
          find public -maxdepth 5 | sort

      - name: Verify the signature before publishing
        run: |
          for d in public/dists/trixie public/bookworm/dists/bookworm; do
            gpg --verify "$d/InRelease"
            gpg --verify "$d/Release.gpg" "$d/Release"
          done

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v5
